# Sri Lanka general statutory pack, rules in force from 2024-01-01.
# Sources are IRD (ird.gov.lk) notices and consolidated Acts, checked 2026-11-14.

questions:
  - key: registered_vat
    text: Is the business registered for VAT?
    type: yes_no
  - key: sscl_liable
    text: Is the business registered for, and liable to, the Social Security Contribution Levy (SSCL)?
    type: yes_no
  - key: sscl_activity
    text: Which activity does the business's SSCL-liable turnover come from?
    type: choice
    options: [services, retail_wholesale, manufacturing, distributor]

accounts:
  - key: output_tax_control
    name: VAT Output Tax Control
    subtype: current_liability
    purpose: VAT charged on sales, awaiting payment to the Inland Revenue Department
    add_when: registered_vat
  - key: input_tax_control
    name: VAT Input Tax Control
    subtype: current_asset
    purpose: Recoverable VAT on purchases
    add_when: registered_vat
  - key: sscl_payable
    name: SSCL Payable
    subtype: current_liability
    purpose: Social Security Contribution Levy accrued, awaiting payment
    add_when: sscl_liable
  - key: sscl_expense
    name: SSCL Expense
    subtype: operating_expense
    purpose: Social Security Contribution Levy borne by the business
    add_when: sscl_liable

taxes:
  - key: VAT
    name: Value added tax
    kind: output_input
    applies_when: registered_vat
    accounts: {output: output_tax_control, input: input_tax_control}
    filing:
      frequency: monthly
      due: {day_of_following_month: 31}
    registration_threshold:
      amount: "60000000.00"
      measure: rolling_12_months
      effective_from: 2024-01-01
      source: "VAT Act No. 14 of 2002, s.10, as amended; IRD notice SEC/PN/VAT/2026-03 dated 2026-07-03, para 3 (LKR 60m in 12 months, or LKR 15m in a quarter)"
  - key: SSCL
    name: Social Security Contribution Levy
    kind: levy
    charged_to_customer: false
    applies_when: sscl_liable
    accounts: {payable: sscl_payable, expense: sscl_expense}
    filing:
      frequency: quarterly
      due: {day_of_following_month: 20}
    registration_threshold:
      amount: "36000000.00"
      measure: rolling_12_months
      effective_from: 2026-07-01
      source: "SSCL Act No. 25 of 2022 as amended by Act No. 10 of 2026; IRD notice PN/SSCL/2026-04/1 dated 2026-04-16 (LKR 36m in four quarters, or LKR 9m in a quarter, from 2026-07-01)"

tax_codes:
  - key: VAT-STD
    tax: VAT
    name: Standard-rated
    applies_to: [sales, purchases]
    treatment: standard
    input_recoverable: true
    rates:
      - rate: "18"
        effective_from: 2024-01-01
        effective_to: null
        source: "VAT Act No. 14 of 2002 as amended by Act No. 16 of 2024; IRD notice PN/VAT/2024-01 dated 2024-03-26 (18% from 2024-01-01)"
  - key: VAT-NR
    tax: VAT
    name: Standard-rated, input tax not recoverable
    applies_to: [purchases]
    treatment: standard
    input_recoverable: false
    rates:
      - rate: "18"
        effective_from: 2024-01-01
        effective_to: null
        source: "VAT Act No. 14 of 2002 as amended by Act No. 16 of 2024; IRD notice PN/VAT/2024-01 dated 2024-03-26"
  - key: VAT-ZERO
    tax: VAT
    name: Zero-rated (exports and specified services)
    applies_to: [sales]
    treatment: zero_rated
    rates:
      - rate: "0"
        effective_from: 2024-01-01
        effective_to: null
        source: "VAT Act No. 14 of 2002, s.7 (zero-rating); IRD notice SEC/PN/VAT/2026-03 dated 2026-07-03, para on garment buying offices"
  - key: VAT-EX
    tax: VAT
    name: Exempt
    applies_to: [sales, purchases]
    treatment: exempt
  - key: SSCL-SVC
    tax: SSCL
    name: SSCL, services (100% of turnover liable)
    applies_to: [sales]
    applies_when: {question: sscl_activity, in: [services]}
    treatment: standard
    rates:
      - rate: "2.5"
        base: {fraction: "1"}
        effective_from: 2024-01-01
        effective_to: null
        source: "SSCL Act No. 25 of 2022, s.3 and Second Schedule; IRD SSCL page, checked 2026-11-14"
  - key: SSCL-RW
    tax: SSCL
    name: SSCL, wholesale and retail (50% of turnover liable)
    applies_to: [sales]
    applies_when: {question: sscl_activity, in: [retail_wholesale]}
    treatment: standard
    rates:
      - rate: "2.5"
        base: {fraction: "1/2"}
        effective_from: 2024-01-01
        effective_to: null
        source: "SSCL Act No. 25 of 2022, s.3 and Second Schedule; IRD SSCL page, checked 2026-11-14"
  - key: SSCL-MFG
    tax: SSCL
    name: SSCL, manufacture (85% of turnover liable)
    applies_to: [sales]
    applies_when: {question: sscl_activity, in: [manufacturing]}
    treatment: standard
    rates:
      - rate: "2.5"
        base: {fraction: "17/20"}
        effective_from: 2024-01-01
        effective_to: null
        source: "SSCL Act No. 25 of 2022, s.3 and Second Schedule; IRD SSCL page, checked 2026-11-14"
  - key: SSCL-DIST
    tax: SSCL
    name: SSCL, registered distributor for a manufacturer (25% of turnover liable)
    applies_to: [sales]
    applies_when: {question: sscl_activity, in: [distributor]}
    treatment: standard
    rates:
      - rate: "2.5"
        base: {fraction: "1/4"}
        effective_from: 2024-01-01
        effective_to: null
        source: "SSCL Act No. 25 of 2022, s.3 and Second Schedule; IRD SSCL page, checked 2026-11-14"

rounding:
  level: line
  method: half_up
  decimals: 2

returns:
  - key: VAT-RETURN
    tax: VAT
    name: VAT return (management mapping, not the IRD form)
    boxes:
      - key: "1"
        label: Standard-rated sales
        sum: [{code: VAT-STD, side: sales, measure: net}]
      - key: "2"
        label: Zero-rated sales
        sum: [{code: VAT-ZERO, side: sales, measure: net}]
      - key: "3"
        label: Exempt sales
        sum: [{code: VAT-EX, side: sales, measure: net}]
      - key: "4"
        label: Output tax
        sum: [{code: VAT-STD, side: sales, measure: output_tax}]
      - key: "5"
        label: Purchases
        sum:
          - {code: VAT-STD, side: purchases, measure: net}
          - {code: VAT-NR, side: purchases, measure: net}
          - {code: VAT-EX, side: purchases, measure: net}
      - key: "6"
        label: Recoverable input tax
        sum: [{code: VAT-STD, side: purchases, measure: input_tax}]
  - key: SSCL-RETURN
    tax: SSCL
    name: SSCL return (management mapping, not the IRD form)
    boxes:
      - key: "1"
        label: Turnover by activity, before the liable portion
        sum:
          - {code: SSCL-SVC, side: sales, measure: net}
          - {code: SSCL-RW, side: sales, measure: net}
          - {code: SSCL-MFG, side: sales, measure: net}
          - {code: SSCL-DIST, side: sales, measure: net}
      - key: "2"
        label: Levy due
        sum:
          - {code: SSCL-SVC, side: sales, measure: tax}
          - {code: SSCL-RW, side: sales, measure: tax}
          - {code: SSCL-MFG, side: sales, measure: tax}
          - {code: SSCL-DIST, side: sales, measure: tax}

pending_changes: []
